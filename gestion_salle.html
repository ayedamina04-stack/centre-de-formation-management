<head>
<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="sallesn.css">
<script src="salle.js"></script>
</head>

<body class="bg-light">

<header class="bg-primary text-white p-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h3">EmpowerTech Training Center</h1>
    <nav>
      <a href="index2.html" class="text-white me-3">Home</a>
      <a href="service.html" class="text-white me-3">Services</a>
      <a href="contact.html" class="text-white me-3">Contact</a>
      <a href="gestion_salle.html" class="text-warning fw-bold">Salles</a>
    </nav>
  </div>
</header>

<main class="container">

  <!-- FORMULAIRE AJOUT / MODIF -->
  <section class="mb-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h2 class="h5 mb-0">Ajouter / Modifier une salle</h2>
      </div>
      <div class="card-body">
        <form id="salleForm" name="f" action="ajouter.php" method="POST">
          <div class="mb-3">
            <label for="reference" class="form-label">Réference  de la salle</label>
            <input type="text" name="ref"  id="ref" class="form-control" placeholder="Ex:4000" required>
          </div>
          <div class="mb-3">
            <label for="nom" class="form-label">Nom de la salle</label>
            <input type="text" name="nom"  id="nom" class="form-control" placeholder="Ex: Salle A1" required>
          </div>
          <div class="mb-3">
            <label for="capacite" class="form-label">Capacité</label>
            <input type="number" id="capacite" name="capacite" class="form-control" min="1" placeholder="Ex: 30" required>
          </div>
          <div class="mb-3">
            <label for="type" class="form-label">Type</label>
            <select id="type"name="type" class="form-control" required>
              <option value="">Choisir</option>
              <option value="informatique">Informatique</option>
              <option value="conference">Conférence</option>
              <option value="classique">Classique</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="statut" class="form-label">Statut</label>
            <select id="statut" name="dispo" class="form-control">
              <option value="Disponible">Disponible</option>
              <option value="Indisponible">Indisponible</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success me-2"><i class="fas fa-save"></i> Enregistrer</button>
          <button type="submit" class="btn btn-success me-2"><i class="fas fa-save"></i> Modifier</button>
          <button type="reset" class="btn btn-secondary"><i class="fas fa-times"></i> Annuler</button>
          <p id="erreur" class="text-danger mt-2"></p>
        </form>
      </div>
    </div>
  </section>

</main>

<footer class="bg-dark text-white text-center p-3 mt-5">
  &copy; 2026 EmpowerTech Training Center
</footer>

</body>
</html>
